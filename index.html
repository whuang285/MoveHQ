<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Move HQ</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head><body>
<div id="auth" class="auth"><div class="auth-card"><div class="logo">MOVE HQ</div><h1 id="authTitle">Sign in</h1><p id="authSub">Your move, packing, and new-home workspace.</p><form id="authForm"><input id="authEmail" type="email" placeholder="Email" required><input id="authPassword" type="password" placeholder="Password" minlength="6" placeholder="Password" required><button class="primary" type="submit">Sign in</button></form><button id="toggleAuth" class="linkbtn">Need an account? Sign up</button><div id="authMsg" class="msg"></div></div></div>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Edit</h2><button id="closeModal" class="iconbtn">×</button></div><form id="modalForm"></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
